<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>AwasPatna Admin App</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0114 0M16 4.5a3.5 3.5 0 010 7M18 14a7 7 0 013 6"/></symbol>
<symbol id="i-ad" viewBox="0 0 24 24"><path d="M3 10v4h4l7 5V5L7 10zM17 9a4 4 0 010 6"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></symbol>
<symbol id="i-out" viewBox="0 0 24 24"><path d="M10 4H5v16h5M16 8l4 4-4 4M20 12H9"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
<symbol id="i-block" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 1112 0v5l2 2H4zM10 21h4"/></symbol>
<symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></symbol>
</defs></svg>

<!-- 7-SECOND AUTO-HIDE INSTALL POPUP -->
<div id="installPopup" class="fixed top-16 left-1/2 -translate-x-1/2 z-[80] w-[92%] max-w-sm p-3 rounded-2xl shadow-2xl flex items-center justify-between gap-2.5 transition-all duration-300" style="background:#14142b;color:#fff;border:1px solid rgba(255,255,255,.18)">
  <div class="flex items-center gap-2.5 min-w-0">
    <span class="grad w-9 h-9 rounded-xl grid place-items-center shrink-0"><svg class="ic !w-4 !h-4"><use href="#i-dl"/></svg></span>
    <div class="min-w-0">
      <div class="hd font-extrabold text-xs truncate">AwasPatna Admin App</div>
      <div class="text-[10px] opacity-80 truncate">Fast approval alerts ke liye install karein</div>
    </div>
  </div>
  <div class="flex items-center gap-1.5 shrink-0">
    <button id="popupInstallBtn" class="grad px-3 py-1.5 rounded-xl text-[11px] font-extrabold">Install</button>
    <button id="popupCloseBtn" class="w-7 h-7 rounded-lg grid place-items-center bg-white/10 text-xs">✕</button>
  </div>
</div>

<!-- SECURE FIREBASE LOGIN (ONLY EMAIL & PASSWORD - GOOGLE REMOVED) -->
<div id="login" class="fixed inset-0 z-50 grad grid place-items-center p-5">
  <div class="cd w-full max-w-sm p-6 text-center" style="border-radius:30px">
    <div class="grad w-15 h-15 rounded-3xl mx-auto grid place-items-center shadow-lg"><svg class="ic !w-7 !h-7"><use href="#i-lock"/></svg></div>
    <h1 class="hd font-extrabold text-2xl mt-3">AwasPatna Admin</h1>
    <p class="text-xs mt-1" style="color:var(--mut)">Authorized Admin Access Only</p>

    <div class="mt-4 space-y-2.5">
      <input id="admEmail" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Authorized Admin Email" class="fld text-sm" style="user-select:text">
      <div class="relative">
        <input id="admPass" type="password" autocomplete="current-password" autocapitalize="none" placeholder="Admin Password" class="fld text-sm pr-16" style="user-select:text">
        <button id="togPassBtn" type="button" class="absolute right-2.5 top-1/2 -translate-y-1/2 px-2 py-1 rounded-lg text-[11px] font-extrabold soft">Show</button>
      </div>
    </div>

    <p id="pinErr" class="text-xs text-red-500 mt-2.5 min-h-[1rem] leading-snug"></p>
    <button id="enter" type="button" class="grad w-full py-3.5 rounded-2xl font-extrabold mt-1 active:scale-95 transition">Email Se Secure Login Karein</button>
    <button id="resetPassBtn" type="button" class="text-xs font-bold underline mt-3.5 block mx-auto" style="color:var(--a)">Password Bhool Gaye? Gmail par Reset Link Bhejein</button>
  </div>
</div>

<!-- MAIN ADMIN APP -->
<div id="app" class="hidden relative max-w-md mx-auto min-h-screen">
  <header class="bar px-3.5 py-3 flex items-center justify-between gap-1">
    <div class="flex items-center gap-2 min-w-0">
      <span class="w-8 h-8 rounded-xl bg-white grid place-items-center shrink-0" style="color:var(--a)"><svg class="ic !w-4 !h-4"><use href="#i-shield"/></svg></span>
      <div class="leading-tight truncate">
        <div class="hd font-extrabold text-[15px] truncate">AwasPatna</div>
        <div class="text-[9.5px] font-bold opacity-85 tracking-widest">ADMIN PANEL</div>
      </div>
    </div>
    <div class="flex items-center gap-1.5 shrink-0">
      <button id="admNotifBtn" class="glassc w-9 h-9 rounded-full grid place-items-center relative" title="Enable Approval Alerts">
        <svg class="ic !w-4 !h-4"><use href="#i-bell"/></svg>
        <span id="notifDot" class="w-2 h-2 rounded-full bg-yellow-300 absolute top-1.5 right-1.5"></span>
      </button>
      <button data-a="tab" data-v="lst" data-f="pending" class="glassc h-9 px-2.5 rounded-full text-[11px] font-extrabold flex items-center gap-1">
        <span id="pendN" class="bg-yellow-300 text-yellow-900 rounded-full min-w-4 h-4 px-1 grid place-items-center text-[10px]">0</span>Pending
      </button>
      <button data-a="logout" class="glassc w-9 h-9 rounded-full grid place-items-center" aria-label="Logout"><svg class="ic !w-4 !h-4"><use href="#i-out"/></svg></button>
    </div>
  </header>

  <main id="view" class="px-4 pt-4 pb-36"></main>

  <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-30 px-3" style="padding-bottom:calc(env(safe-area-inset-bottom,0px) + .6rem)">
    <div id="tabs" class="nv grid grid-cols-5 px-1 py-2.5 text-[10.5px] font-bold" style="color:var(--mut)"></div>
  </nav>
</div>

<!-- ADD LISTING MODAL -->
<div id="modal" class="modal fixed inset-0 z-50 flex items-end justify-center p-3" style="background:rgba(8,6,24,.6)">
  <div class="sheet cd w-full max-w-md p-5" style="border-radius:28px">
    <div class="flex items-center justify-between mb-3"><h3 class="hd font-extrabold text-lg">Nayi Listing Jodein</h3><button data-a="closeAdd" class="soft w-9 h-9 rounded-full grid place-items-center" aria-label="Close"><svg class="ic !w-4 !h-4"><use href="#i-x"/></svg></button></div>
    <div class="grid gap-2.5">
      <input id="nT" class="fld" placeholder="Title (jaise 2 BHK Flat)" style="user-select:text">
      <div class="grid grid-cols-2 gap-2.5">
        <select id="nTy" class="fld"><option>Room</option><option>Flat</option><option>Plot</option><option>Commercial</option></select>
        <select id="nL" class="fld"></select>
      </div>
      <input id="nP" class="fld" placeholder="Price (jaise ₹8,000)" style="user-select:text">
      <input id="nPh" class="fld" inputmode="numeric" maxlength="10" placeholder="Owner 10-digit Mobile Number" style="user-select:text">
    </div>
    <p id="nErr" class="text-xs text-red-500 mt-2 min-h-[1rem]"></p>
    <button data-a="saveAdd" class="grad w-full py-3.5 rounded-2xl font-extrabold mt-1 active:scale-95 transition">Listing save karein</button>
  </div>
</div>

<!-- FULL-SCREEN IMAGE ZOOM MODAL -->
<div id="imgZoomModal" class="modal fixed inset-0 z-[75] flex items-center justify-center p-4" style="background:rgba(0,0,0,.88)" onclick="this.classList.remove('open')">
  <img id="zoomImg" class="max-w-full max-h-[85vh] rounded-2xl object-contain shadow-2xl" alt="Property Preview">
</div>

<div id="toast" class="fixed left-1/2 -translate-x-1/2 z-[70] rounded-full px-4 py-2.5 text-xs font-bold text-white opacity-0 pointer-events-none transition-all" style="bottom:7rem;background:#14142b"></div>

<script type="module" src="admin.js"></script>
</body>
</html>
